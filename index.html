/* Layout : écran noir, orbe de particules seule au centre ; sur commande la carte du monde, fixe, jaillit de l'orbe qui se range en bas à droite. Micro en bas. */
:root{
  --void:#030406;
  --ink:#eef1f6;
  --dim:#7f8798;
  --red:#ff2a3d;
  --hair:rgba(255,255,255,.14);
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--void)}
body{height:100%;background:var(--void);color:var(--ink);font-family:var(--mono);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.fx{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 85% at 50% 45%,transparent 50%,rgba(0,0,0,.85) 100%)}
#probe{position:absolute;width:0;height:0;padding-right:env(safe-area-inset-right,0px);padding-left:env(safe-area-inset-left,0px);visibility:hidden}

.orb{position:absolute;left:0;top:0;pointer-events:none;width:260px;height:260px;padding:0;border:0;background:none;cursor:pointer;border-radius:50%;
  transform-origin:50% 50%;transition:transform 1.25s cubic-bezier(.7,0,.2,1);z-index:3}
.orb canvas{width:260px;height:260px;display:block}

.mic{position:absolute;z-index:4;width:58px;height:58px;border-radius:50%;border:1px solid var(--hair);background:rgba(10,12,16,.6);
  display:grid;place-items:center;cursor:pointer;transition:left 1.25s cubic-bezier(.7,0,.2,1),top 1.25s cubic-bezier(.7,0,.2,1),border-color .2s,box-shadow .2s;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.mic svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round}
.mic.on{border-color:var(--red);box-shadow:0 0 0 6px rgba(255,42,61,.12),0 0 24px rgba(255,42,61,.5)}
.mic.on svg{stroke:var(--red)}
.mic:focus-visible{outline:1px solid var(--red);outline-offset:4px}

#cam{position:absolute;z-index:4;left:max(16px,env(safe-area-inset-left,0px));bottom:16px;width:92px;height:122px;object-fit:cover;border-radius:14px;border:1px solid var(--hair);transform:scaleX(-1);opacity:0;pointer-events:none;transition:opacity .4s}
#cam.on{opacity:1}
@media (prefers-reduced-motion:reduce){.orb,.mic{transition:none}}
</style>

// taille normale : la carte entière, centrée, fixe

}

// ───────── orbe de particules (sphère → anneau quand tu parles)

function say(txt){speaking=true;const fb=setTimeout(()=>speaking=false,Math.max(1500,txt.length*65));
  if('speechSynthesis'in window){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='fr-FR';if(vox)u.voice=vox;u.pitch=.5;u.rate=.95;u.onstart=()=>{speaking=true;clearTimeout(fb)};u.onend=u.onerror=()=>speaking=false;speechSynthesis.speak(u)}catch(e){}}}

// ───────── transitions
function openMap(){if(mode==='map')return;const p=orbPos();mode='map';Object.assign(cam,homeCam());reveal={x:p.x,y:p.y,t0:performance.now(),d:reduce?1:1500};place();setTimeout(()=>say("Carte du monde affichée."),reduce?0:900)}
function closeMap(){if(mode!=='map')return;mode='idle';sel=null;place();setTimeout(()=>say("Carte fermée."),reduce?0:700)}

// ───────── cerveau
const norm=s=>' '+s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ')+' ';
function target(c){sel=c;const d=Math.round(km([paris.lo,paris.la],[c.lo,c.la]));say(c===paris?"Paris. Point d'origine.":`${c.n}. À ${d.toLocaleString('fr-FR')} kilomètres de Paris.`)}
let awake=false;
function respond(raw){const t=norm(raw);if(!t.trim())return;awake=true;
  if(/ (ferme|cache|enleve|retire|quitte)/.test(t)&&/ carte|map/.test(t))return closeMap();
  if(/ carte | maps? | monde | planete /.test(t)){if(mode!=='map')return openMap();resetZoom();return say("Taille normale.")}
  if(/ salut | bonjour | hello | coucou /.test(t))return say("Salut Yaniss. Ultron en ligne.");
  if(/ qui es | ton nom /.test(t))return say("Je suis Ultron. Je vois tout, je te guide partout.");
  if(/ heure /.test(t)){const d=new Date();return say(`Il est ${d.getHours()} heures ${String(d.getMinutes()).padStart(2,'0')}.`)}
  if(/ normal| reinitialise| reset/.test(t)){resetZoom();return say("Taille normale.")}
  if(mode!=='map')return say("Dis-moi : montre-moi la carte.");
  const c=cities.find(c=>t.includes(norm(c.n))||c.al.some(a=>t.includes(norm(a))));if(c)return target(c);
  if(/ dezoom| retreci| moins /.test(t)){zoomAt(W/2,H/2,.5);return say("Vue élargie.")}
  if(/ zoom| agrandi| plus /.test(t)){zoomAt(W/2,H/2,2);return say("J'agrandis.")}
  say("Je n'ai pas compris. Demande une ville, par exemple Tokyo.")}

// ───────── micro (sans clavier)
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,srOk=!!SR;
function stopListen(){listening=false;micBtn.classList.remove('on');try{rec&&rec.stop()}catch(e){}}
function micBlocked(){srOk=false;stopListen();say("Le micro est bloqué ici. Utilise tes gestes.")}
function listen(){if(listening){stopListen();return}
  if('speechSynthesis'in window)speechSynthesis.cancel();speaking=false;awake=true;
  if(!srOk)return micBlocked();
  try{rec=new SR();rec.lang='fr-FR';rec.interimResults=false;rec.maxAlternatives=1;let got=false;
    rec.onresult=e=>{got=true;stopListen();respond(e.results[0][0].transcript)};
    rec.onerror=e=>{stopListen();if(/not-allowed|service-not-allowed|audio-capture/.test(e.error))micBlocked()};
    rec.onend=()=>{if(!got&&listening)stopListen()};
    listening=true;micBtn.classList.add('on');rec.start()}catch(e){micBlocked()}}
micBtn.addEventListener('click',listen);

// ───────── gestes du doigt
const HELP_OLD="Glisse vers le haut pour ouvrir la carte, vers le bas pour la fermer. Pince sur moi pour m'agrandir ou me rétrécir, pince sur la carte pour zoomer, double-tape pour revenir à la taille normale. Glisse à gauche ou à droite pour changer de ville. Dessine un cercle pour me saluer, garde le doigt appuyé pour l'état du système.";

const HELP="Ouvre la main pour afficher la carte et zoomer : plus tu écartes les doigts, plus j'agrandis. Déplace ta main pour bouger la carte. Ferme le poing pour revenir à la taille normale. Dis ferme la carte pour la cacher.";
const G={
  tap(p){const o=orbPos();if(Math.hypot(p.x-o.x,p.y-o.y)<110*o.k){if(!started)startAll();else if(!micOn)listen();return}
    if(mode!=='map'){wake();return}let best=null,bd=26;for(const c of cities){const[sx,sy]=toS(c.x,c.y),d=Math.hypot(sx-p.x,sy-p.y);if(d<bd){bd=d;best=c}}if(best)target(best)},
  double(){if(mode==='map'){sel=null;resetZoom()}},
  up(){awake=true;if(mode!=='map')openMap()},
  down(){if(mode==='map')closeMap()},
  side(dir){if(mode!=='map')return;awake=true;const n=cities.length,i=sel?cities.indexOf(sel):(dir>0?-1:0);target(cities[(i+dir+n)%n])},
  circle(){awake=true;say("Salut Yaniss. Je suis là, tous mes systèmes sont opérationnels.")},
  hold(){awake=true;const d=new Date();say(`Systèmes opérationnels. Il est ${d.getHours()} heures ${String(d.getMinutes()).padStart(2,'0')}.`)},
  two(){awake=true;say(HELP)}};

// ───────── micro permanent (pas besoin de toucher)
let micOn=false,started=false;
function startMic(){if(!SR)return;rec=new SR();rec.lang='fr-FR';rec.continuous=true;rec.interimResults=false;
  rec.onspeechstart=()=>{if(!speaking)listening=true};rec.onspeechend=()=>listening=false;
  rec.onresult=e=>{listening=false;const r=e.results[e.results.length-1];if(r.isFinal&&!speaking)respond(r[0].transcript)};
  rec.onerror=e=>{if(/not-allowed|service-not-allowed/.test(e.error))micOn=false};
  rec.onend=()=>{listening=false;if(micOn)setTimeout(()=>{try{rec.start()}catch(_){}},250)};
  micOn=true;try{rec.start()}catch(_){}}
function startAll(){started=true;awake=true;say("Salut Yaniss. Ultron en ligne. Autorise la caméra, puis ouvre la main.");startMic();
  const tryCam=()=>window.ULcam?window.ULcam():setTimeout(tryCam,300);tryCam()}

// ───────── gestes de la main (caméra) : main ouverte = zoom, poing = taille normale, déplacer la main = déplacer la carte
const HG={hand:null,o:0,last:null,openSince:0,fistSince:0,seen:0};

  return Math.max(0,Math.min(1,((avg-1.15)/.75)*.7+((spread-.9)/1.0)*.3))}
function onHands(l){const now=performance.now();HG.hand=l;if(!l){HG.last=null;HG.openSince=0;HG.fistSince=0;return}HG.seen=now;
  HG.o+=(openness(l)-HG.o)*.35;const palm={x:1-(l[0].x+l[9].x)/2,y:(l[0].y+l[9].y)/2};
  if(mode!=='map'){if(HG.o>.7){if(!HG.openSince)HG.openSince=now;else if(now-HG.openSince>700){HG.openSince=0;awake=true;openMap()}}else HG.openSince=0;HG.last=palm;return}
  anim=null;
  if(HG.o<.2){if(!HG.fistSince)HG.fistSince=now;if(now-HG.fistSince>200){zoomAt(W/2,H/2,Math.pow(sMin/cam.s,.2));const h=homeCam();cam.x+=(h.x-cam.x)*.2;cam.y+=(h.y-cam.y)*.2;clampCam()}HG.last=palm;return}
  HG.fistSince=0;
  const ts=sMin*(1+4*Math.pow(Math.min(1,(HG.o-.2)/.8),1.2));zoomAt(W/2,H/2,Math.pow(ts/cam.s,.15));
  if(HG.last){const dx=palm.x-HG.last.x,dy=palm.y-HG.last.y;if(Math.hypot(dx,dy)>.003){cam.x-=dx*W*1.6/cam.s;cam.y-=dy*H*1.3/cam.s;clampCam()}}
  HG.last=palm}
function drawHand(){}
window.UL={hands:onHands,camReady:()=>{document.getElementById('cam').classList.add('on');say("Caméra active. Ouvre la main pour afficher la carte.")},camFail:()=>say("Je n'ai pas accès à la caméra. Autorise-la dans les réglages de Safari.")};

function loop(t){
  if(anim){const k=Math.min(1,(t-anim.t0)/anim.d),e=1-Math.pow(1-k,3);cam.x=anim.f.x+(anim.t.x-anim.f.x)*e;cam.y=anim.f.y+(anim.t.y-anim.f.y)*e;cam.s=Math.exp(Math.log(anim.f.s)+(Math.log(anim.t.s)-Math.log(anim.f.s))*e);if(k>=1){anim=null;clampCam()}}
  drawMap(t);drawHand(t);drawOrb(t);requestAnimationFrame(loop)}
addEventListener('resize',resize);resize();requestAnimationFrame(loop);
})();
</script>

<script type="module">
import {HandLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
window.ULcam=async()=>{if(window.ULcam.busy)return;window.ULcam.busy=true;
  try{const v=document.getElementById('cam');const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});v.srcObject=st;await v.play();
    const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const opts=d=>({baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:d},runningMode:"VIDEO",numHands:1});
    let lm;try{lm=await HandLandmarker.createFromOptions(fs,opts("GPU"))}catch(e){lm=await HandLandmarker.createFromOptions(fs,opts("CPU"))}
    window.UL.camReady();let lastT=-1;
    const tick=()=>{if(v.readyState>=2&&v.currentTime!==lastT){lastT=v.currentTime;try{const r=lm.detectForVideo(v,performance.now());window.UL.hands(r.landmarks&&r.landmarks.length?r.landmarks[0]:null)}catch(e){}}requestAnimationFrame(tick)};tick()}
  catch(e){window.ULcam.busy=false;window.UL.camFail(e)}};
</script>

<title>ULTRON</title>

<style>
/* ULTRON : orbe seul sur fond noir ; la Terre en 3D jaillit de l'orbe ; caméra et « Conversation » en bas à gauche */
:root{--void:#030406;--ink:#eef1f6;--dim:#7f8798;--red:#ff2a3d;--hair:rgba(255,255,255,.14);--glass:rgba(10,12,17,.8);
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--display:"Chakra Petch",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);font-family:var(--mono);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{position:fixed;inset:0;touch-action:none}
#globe{position:absolute;inset:0;clip-path:circle(0px at 50% 50%)}
#globe canvas{display:block;width:100%;height:100%}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;font-size:10px;letter-spacing:.1em;color:rgba(238,241,246,.85);white-space:nowrap;text-shadow:0 0 6px #000,0 0 2px #000;text-transform:uppercase}
.fx{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 85% at 50% 45%,transparent 55%,rgba(0,0,0,.8) 100%)}
.orb{position:absolute;left:0;top:0;width:260px;height:260px;pointer-events:none;transform-origin:50% 50%;transition:transform 1.25s cubic-bezier(.7,0,.2,1);z-index:3}
.orb canvas{width:260px;height:260px;display:block}
#cam{position:absolute;z-index:5;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(66px + env(safe-area-inset-bottom,0px));width:88px;height:116px;object-fit:cover;border-radius:14px;border:1px solid var(--hair);transform:scaleX(-1);pointer-events:none;background:#000}
.camst{position:absolute;z-index:6;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(66px + env(safe-area-inset-bottom,0px));width:88px;height:116px;display:grid;place-items:center;text-align:center;padding:8px;font:500 9px/1.4 var(--mono);letter-spacing:.12em;color:var(--dim);text-transform:uppercase;pointer-events:none}
.camst[hidden]{display:none}
.convo{position:absolute;z-index:5;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:9px;padding:10px 15px;border-radius:22px;border:1px solid var(--hair);background:var(--glass);color:var(--dim);font:500 11px var(--mono);letter-spacing:.18em;text-transform:uppercase;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.convo i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.convo.on{color:var(--ink);border-color:rgba(255,42,61,.5)}
.convo.on i{background:var(--red);box-shadow:0 0 8px var(--red);animation:blink 1.4s infinite}
.convo.think i{background:#ffb35c;box-shadow:0 0 8px #ffb35c}
@keyframes blink{50%{opacity:.3}}
.card{position:absolute;z-index:6;top:calc(16px + env(safe-area-inset-top,0px));left:50%;width:min(360px,calc(100% - 32px));transform:translate(-50%,-14px);opacity:0;transition:opacity .35s,transform .35s;
  background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--hair);border-top:2px solid var(--red);border-radius:16px;overflow:hidden;pointer-events:none}
.card.show{opacity:1;transform:translate(-50%,0)}
.card img{display:block;width:100%;height:160px;object-fit:cover;background:#0b0d12}
.card img[hidden]{display:none}
.card .b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px}
.card .k{font-size:9px;letter-spacing:.22em;color:var(--red);text-transform:uppercase}
.card h2{margin:0;font:600 22px var(--display);letter-spacing:.04em}
.card p{margin:6px 0 0;font:400 12px/1.55 var(--mono);color:#c9ced8;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.modal{position:absolute;inset:0;z-index:9;display:grid;place-items:center;background:rgba(0,0,0,.6);padding:16px}
.modal[hidden]{display:none}
.modal .in{width:min(360px,100%);background:#0c0e13;border:1px solid var(--hair);border-top:2px solid var(--red);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font:600 18px var(--display);letter-spacing:.06em}
.modal p{margin:0;font-size:12px;line-height:1.5;color:#b9bfca}
.modal input{font:400 14px var(--mono);color:var(--ink);background:#05070a;border:1px solid var(--hair);border-radius:10px;padding:11px 12px;width:100%;-webkit-user-select:text;user-select:text}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
.modal button{font:600 12px var(--mono);letter-spacing:.12em;padding:10px 14px;border-radius:10px;border:1px solid var(--hair);background:none;color:var(--ink);cursor:pointer}
.modal button.go{background:var(--red);border-color:var(--red);color:#120204}
@media (prefers-reduced-motion:reduce){.orb{transition:none}}
</style></head><body>
<div id="app">
  <div id="globe"><div id="labels"></div></div>
  <div class="fx"></div>
  <div class="orb" id="orb"><canvas id="orbc"></canvas></div>
  <video id="cam" playsinline muted autoplay></video>
  <div class="camst" id="camst">Caméra…</div>
  <div class="convo" id="convo"><i></i>Conversation</div>
  <div class="card" id="card"><img id="cimg" alt="" hidden><div class="b"><span class="k" id="ck"></span><h2 id="cn"></h2><p id="cd"></p></div></div>
  <div class="modal" id="modal" hidden><div class="in">
    <h3>CLÉ CLAUDE</h3>
    <p>Pour parler librement avec Ultron, colle ta clé API Claude (elle commence par sk-ant-). Elle reste uniquement sur ce téléphone.</p>
    <input id="keyin" type="password" placeholder="sk-ant-…" autocomplete="off">
    <div class="row"><button id="kno">Annuler</button><button class="go" id="kok">Enregistrer</button></div>
  </div></div>
</div>
<script type="module">
const $=id=>document.getElementById(id);
const app=$('app'),orbEl=$('orb'),oc=$('orbc'),ox=oc.getContext('2d'),globeEl=$('globe'),labelsEl=$('labels');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=innerWidth,H=innerHeight,DPR=Math.min(2,devicePixelRatio||1),mode='idle',started=false;
const R=Math.PI/180;

// ───────── orbe de particules (sphère → anneau quand tu parles)
const N=620,base=[],ringT=[],pairs=[];let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const GA=Math.PI*(3-Math.sqrt(5));
for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),th=GA*i;base.push([Math.cos(th)*r+(rnd()-.5)*.06,y+(rnd()-.5)*.06,Math.sin(th)*r+(rnd()-.5)*.06]);
  const a=i/N*Math.PI*2*7%(Math.PI*2),rr=1.05+(rnd()-.5)*.32;ringT.push([Math.cos(a)*rr,Math.sin(a)*rr,(rnd()-.5)*.35])}
for(let i=0;i<N;i++){const d=[];for(let j=0;j<N;j++)if(j!==i){const a=base[i],b=base[j];d.push([(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2,j])}d.sort((a,b)=>a[0]-b[0]);for(let k=0;k<3;k++)if(d[k][1]>i)pairs.push(i,d[k][1])}
const ND=[];for(let k=0;k<5;k++){const u=rnd()*2-1,a=rnd()*Math.PI*2,s=Math.sqrt(1-u*u);ND.push([Math.cos(a)*s,u,Math.sin(a)*s,2+rnd()*3,.6+rnd()*1.4])}
let speaking=false,listening=false,lvl=0,morph=0;const P=new Float32Array(N*3);
function drawOrb(t){const S=260,c=130,ts=t/1000;
  const tg=speaking?.55+.45*Math.abs(Math.sin(t/85)*Math.sin(t/211)):listening?.35+.25*Math.abs(Math.sin(t/140)):.0;lvl+=(tg-lvl)*.15;morph+=((listening?1:0)-morph)*.06;
  const amp=.05+lvl*.32,rotY=reduce?0:ts*.35,tilt=.35,cy=Math.cos(rotY),sy=Math.sin(rotY),ct=Math.cos(tilt),st=Math.sin(tilt),Rad=78+lvl*14;
  for(let i=0;i<N;i++){const b=base[i];let n=0;for(const d of ND)n+=Math.sin((b[0]*d[0]+b[1]*d[1]+b[2]*d[2])*d[3]+ts*d[4]*(1+lvl*4));n/=ND.length;
    const k=1+amp*n*2,rg=ringT[i],rk=1+amp*n*1.4;
    const bx=b[0]*k,by=b[1]*k,bz=b[2]*k,x1=bx*cy+bz*sy,z1=-bx*sy+bz*cy,y1=by*ct-z1*st,z2=by*st+z1*ct;
    const ra=reduce?0:ts*.6,cr=Math.cos(ra),sr=Math.sin(ra),rx=(rg[0]*cr-rg[1]*sr)*rk,ry=(rg[0]*sr+rg[1]*cr)*rk,rz=rg[2];
    const x=x1+(rx-x1)*morph,y=y1+(ry-y1)*morph,z=z2+(rz-z2)*morph;
    const f=3.2/(3.2+z);P[i*3]=c+x*Rad*f;P[i*3+1]=c+y*Rad*f;P[i*3+2]=z}
  ox.clearRect(0,0,S,S);ox.globalCompositeOperation='source-over';
  const g=ox.createRadialGradient(c,c,8,c,c,130);g.addColorStop(0,`rgba(255,40,60,${.18+lvl*.25})`);g.addColorStop(.55,`rgba(255,40,60,${.05+lvl*.08})`);g.addColorStop(1,'rgba(255,40,60,0)');ox.fillStyle=g;ox.fillRect(0,0,S,S);
  ox.globalCompositeOperation='lighter';
  const L=[new Path2D(),new Path2D(),new Path2D()];
  for(let k=0;k<pairs.length;k+=2){const a=pairs[k]*3,b=pairs[k+1]*3,z=(P[a+2]+P[b+2])/2,bi=z<-.3?0:z<.3?1:2;L[bi].moveTo(P[a],P[a+1]);L[bi].lineTo(P[b],P[b+1])}
  ox.lineWidth=.6;[.5,.28,.12].forEach((al,i)=>{ox.strokeStyle=`rgba(255,70,80,${al*(.7+lvl*.6)*(1-morph*.6)})`;ox.stroke(L[i])});
  for(let i=0;i<N;i++){const z=P[i*3+2],d=(1.3-z)/2.6,s=.6+d*1.5;ox.fillStyle=d>.62?`rgba(255,${170+lvl*60|0},${170+lvl*40|0},${.9})`:`rgba(255,55,70,${.25+d*.7})`;ox.fillRect(P[i*3]-s/2,P[i*3+1]-s/2,s,s)}
  ox.globalCompositeOperation='source-over'}



// ───────── capitales
const CAPS=[["Paris","France",48.857,2.352],["Londres","Royaume-Uni",51.507,-0.128],["Berlin","Allemagne",52.52,13.405],["Madrid","Espagne",40.417,-3.704],["Rome","Italie",41.903,12.496],["Lisbonne","Portugal",38.722,-9.139],["Bruxelles","Belgique",50.85,4.352],["Amsterdam","Pays-Bas",52.37,4.895],["Berne","Suisse",46.948,7.447],["Vienne","Autriche",48.208,16.373,"Vienne (Autriche)"],["Varsovie","Pologne",52.23,21.012],["Prague","Tchéquie",50.075,14.438],["Budapest","Hongrie",47.498,19.04],["Athènes","Grèce",37.984,23.728],["Stockholm","Suède",59.329,18.069],["Oslo","Norvège",59.914,10.752],["Copenhague","Danemark",55.676,12.568],["Helsinki","Finlande",60.17,24.94],["Dublin","Irlande",53.35,-6.26],["Reykjavik","Islande",64.146,-21.94],["Moscou","Russie",55.756,37.617],["Kiev","Ukraine",50.45,30.524],["Ankara","Turquie",39.934,32.86],["Le Caire","Égypte",30.044,31.236],["Rabat","Maroc",34.02,-6.84],["Alger","Algérie",36.75,3.06],["Tunis","Tunisie",36.806,10.181],["Dakar","Sénégal",14.716,-17.467],["Bamako","Mali",12.639,-8.003],["Accra","Ghana",5.603,-0.187],["Abuja","Nigeria",9.076,7.398],["Kinshasa","RD Congo",-4.322,15.307],["Nairobi","Kenya",-1.292,36.822],["Addis-Abeba","Éthiopie",9.03,38.74],["Pretoria","Afrique du Sud",-25.747,28.229],["Antananarivo","Madagascar",-18.879,47.507],["Riyad","Arabie saoudite",24.713,46.675],["Abou Dabi","Émirats arabes unis",24.453,54.377],["Doha","Qatar",25.285,51.531],["Téhéran","Iran",35.689,51.389],["Bagdad","Irak",33.315,44.366],["Beyrouth","Liban",33.894,35.502],["Amman","Jordanie",31.945,35.928],["Kaboul","Afghanistan",34.555,69.207],["Islamabad","Pakistan",33.684,73.048],["New Delhi","Inde",28.614,77.209],["Dacca","Bangladesh",23.81,90.41],["Pékin","Chine",39.904,116.407],["Oulan-Bator","Mongolie",47.886,106.906],["Séoul","Corée du Sud",37.566,126.978],["Tokyo","Japon",35.676,139.65],["Bangkok","Thaïlande",13.756,100.502],["Hanoï","Viêt Nam",21.028,105.854],["Kuala Lumpur","Malaisie",3.139,101.687],["Singapour","Singapour",1.352,103.82],["Jakarta","Indonésie",-6.208,106.846],["Manille","Philippines",14.6,120.984],["Canberra","Australie",-35.281,149.13],["Wellington","Nouvelle-Zélande",-41.286,174.776],["Washington","États-Unis",38.907,-77.037,"Washington (district de Columbia)"],["Ottawa","Canada",45.421,-75.697],["Mexico","Mexique",19.433,-99.133],["La Havane","Cuba",23.113,-82.366],["Bogota","Colombie",4.711,-74.072],["Caracas","Venezuela",10.48,-66.904],["Quito","Équateur",-0.18,-78.468],["Lima","Pérou",-12.046,-77.043],["Brasilia","Brésil",-15.794,-47.882],["Santiago","Chili",-33.449,-70.669,"Santiago (Chili)"],["Buenos Aires","Argentine",-34.604,-58.382],["Montevideo","Uruguay",-34.901,-56.165]]
  .map(([n,c,la,lo,w])=>({n,c,la,lo,w:w||n}));
const norm=s=>' '+s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ')+' ';
const angDist=(a,b,c,d)=>{const h=Math.sin((c-a)*R/2)**2+Math.cos(a*R)*Math.cos(c*R)*Math.sin((d-b)*R/2)**2;return 2*Math.asin(Math.min(1,Math.sqrt(h)))/R};

// ───────── voix d'Ultron
let vox=null;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function pickVoice(){if(!('speechSynthesis'in window))return;const v=speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang));vox=v.find(v=>/thomas/i.test(v.name))||v.find(v=>/male|homme|daniel|nicolas/i.test(v.name))||v[0]||null}
if('speechSynthesis'in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(txt){if(!txt)return;speaking=true;recPause();const fb=setTimeout(done,Math.max(1500,txt.length*70));
  function done(){speaking=false;clearTimeout(fb);setTimeout(recStart,300)}
  if('speechSynthesis'in window){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='fr-FR';if(vox)u.voice=vox;u.pitch=.7;u.rate=1;u.onstart=()=>{speaking=true;clearTimeout(fb)};u.onend=u.onerror=done;speechSynthesis.speak(u)}catch(e){done()}}}

// ───────── conversation (micro permanent + Claude)
const convoEl=$('convo');let micOn=false,rec=null,thinking=false,history=[];
const setConvo=()=>{convoEl.classList.toggle('on',micOn);convoEl.classList.toggle('think',thinking)};
function recStart(){if(!micOn||speaking||rec||!SR)return;try{rec=new SR();rec.lang='fr-FR';rec.continuous=true;rec.interimResults=false;
  rec.onspeechstart=()=>{listening=true};
  rec.onresult=e=>{const r=e.results[e.results.length-1];if(r.isFinal){listening=false;handle(r[0].transcript)}};
  rec.onerror=e=>{if(/not-allowed|service-not-allowed/.test(e.error)){micOn=false;setConvo()}};
  rec.onend=()=>{listening=false;rec=null;if(micOn&&!speaking)setTimeout(recStart,250)};rec.start()}catch(e){rec=null}}
function recPause(){const r=rec;rec=null;listening=false;try{r&&r.abort()}catch(e){}}
function micToggle(){if(!SR){say("La reconnaissance vocale n'est pas disponible ici. Ouvre Ultron dans Safari.");return}micOn=!micOn;setConvo();if(micOn)recStart();else recPause()}
function findKey(){try{const k=localStorage.getItem('ultron_key');if(k)return k;for(let i=0;i<localStorage.length;i++){const v=localStorage.getItem(localStorage.key(i))||'';const m=v.match(/sk-ant-[A-Za-z0-9_\-]{20,}/);if(m)return m[0]}}catch(e){}return null}
const modal=$('modal'),keyin=$('keyin');
function askKey(){modal.hidden=false;keyin.value='';setTimeout(()=>keyin.focus(),50)}
$('kno').onclick=()=>{modal.hidden=true};
$('kok').onclick=()=>{const v=keyin.value.trim();if(!/^sk-ant-/.test(v)){keyin.style.borderColor='var(--red)';return}try{localStorage.setItem('ultron_key',v)}catch(e){}modal.hidden=true;say("Clé enregistrée. Je t'écoute.")};
modal.addEventListener('pointerdown',e=>e.stopPropagation());
const SYS=()=>`Tu es ULTRON, l'intelligence artificielle personnelle de Yaniss. Tu as le caractère de l'Ultron des films : vif, sûr de toi, un brin théâtral et ironique, mais loyal et bienveillant envers Yaniss. Nous sommes le ${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}, il est ${new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}.
Tes réponses sont lues à voix haute : réponds en français, en une à trois phrases courtes et naturelles, sans markdown, sans liste, sans emoji.
Tu contrôles une carte du monde en 3D. Si Yaniss veut voir la carte, ajoute [CARTE] à la fin. S'il veut la fermer, ajoute [FERMER]. S'il veut voir une capitale ou un pays, ajoute [LIEU:nom de la capitale en français].`;
async function askClaude(text){const key=findKey();if(!key){say("Pour discuter librement, j'ai besoin de ta clé Claude.");askKey();return}
  history.push({role:'user',content:text});history=history.slice(-12);if(history[0].role!=='user')history.shift();
  thinking=true;setConvo();
  try{let r;for(const model of['claude-haiku-5-5','claude-sonnet-5-5']){r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:300,system:SYS(),messages:history})});if(r.status!==404)break}
    thinking=false;setConvo();
    if(r.status===401){history.pop();say("Ta clé Claude n'est pas valide.");try{localStorage.removeItem('ultron_key')}catch(e){}askKey();return}
    if(!r.ok){history.pop();say("Je n'arrive pas à joindre mon cerveau pour le moment.");return}
    const j=await r.json();let t=(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(' ').trim();history.push({role:'assistant',content:t||'…'});
    if(/\[CARTE\]/i.test(t))openMap();if(/\[FERMER\]/i.test(t))closeMap();
    const m=t.match(/\[LIEU:\s*([^\]]+)\]/i);if(m){const c=findCap(norm(m[1]));if(c)goCap(c)}
    say(t.replace(/\[[^\]]*\]/g,'').trim())}
  catch(e){thinking=false;setConvo();history.pop();say("Connexion perdue. Réessaie.")}}
const findCap=t=>CAPS.find(c=>t.includes(norm(c.n))||t.includes(norm(c.c)));
function handle(raw){const t=norm(raw);if(!t.trim())return;
  if(/ (ferme|cache|quitte|enleve|retire)/.test(t)&&/ (carte|globe|monde|terre)/.test(t))return closeMap(),say("Carte fermée.");
  if(/ (ouvre|affiche|montre|lance|sors)/.test(t)&&/ (carte|globe|monde|terre|planete) /.test(t)&&!findCap(t)){openMap();return say("Voici le monde.")}
  if(/ (taille normale|reinitialise|remets? (la carte|a zero))/.test(t)){resetView();return say("Vue d'origine.")}
  if(/ (montre|va |zoom|emmene|direction|ou est|ou se trouve)/.test(t)){const c=findCap(t);if(c){goCap(c);return}}
  askClaude(raw)}

// ───────── orbe : position
const probe=document.createElement('div');probe.style.cssText='position:absolute;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);visibility:hidden';document.body.appendChild(probe);
const inset=side=>parseFloat(getComputedStyle(probe)['padding'+side])||0;
function orbPos(){if(mode==='map'){const k=.42;return{x:W-16-inset('Right')-128*k,y:H-16-inset('Bottom')-128*k,k}}return{x:W/2,y:H*.42,k:1}}
function place(){const p=orbPos();orbEl.style.transform=`translate(${p.x-130}px,${p.y-130}px) scale(${p.k})`}

// ───────── globe 3D
let T=null,G=null;
const view={lon:2,lat:22},tv={lon:2,lat:22};let z=0,zEff=0,lastInput=0,reveal=null;

  else{if(o<HG.base)HG.base=o;else if(o>HG.base+.05){z=Math.min(1,z+(o-HG.base)*.75);HG.base=o}}
  // la carte suit la main
  if(HG.last){const dx=palm.x-HG.last.x,dy=palm.y-HG.last.y;if(Math.hypot(dx,dy)>.003){const g=1+zEff*7;tv.lon-=dx*220/g;tv.lat+=dy*160/g}}
  HG.last=palm}
let camOn=false;
async function startCam(){if(camOn)return;const v=$('cam'),st=$('camst');st.hidden=false;st.textContent='Caméra…';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){st.textContent='Ouvre dans Safari';return}
  try{const s2=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});v.srcObject=s2;v.muted=true;v.setAttribute('playsinline','');await v.play().catch(()=>{});camOn=true;st.hidden=true}
  catch(e){st.textContent=/NotAllowed|Permission/i.test(e.name+e.message)?'Touche pour autoriser':'Caméra indisponible';return}
  try{const V=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');const fs=await V.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const opts=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:d},runningMode:'VIDEO',numHands:1});
    let lm;try{lm=await V.HandLandmarker.createFromOptions(fs,opts('GPU'))}catch(e){lm=await V.HandLandmarker.createFromOptions(fs,opts('CPU'))}
    let lastT=-1;const tick=()=>{if(v.readyState>=2&&v.currentTime!==lastT){lastT=v.currentTime;try{const r=lm.detectForVideo(v,performance.now());onHands(r.landmarks&&r.landmarks.length?r.landmarks[0]:null)}catch(e){}}requestAnimationFrame(tick)};tick()}
  catch(e){say("La détection des mains n'a pas pu démarrer.")}}

// ───────── toucher
const ptrs=new Map();let pz=null,downAt=null,moved=false,lastTap=0,lpT=null;
const pos=e=>({x:e.clientX,y:e.clientY});
app.addEventListener('pointerdown',e=>{if(e.target.closest('.convo,.modal'))return;try{app.setPointerCapture(e.pointerId)}catch(_){}ptrs.set(e.pointerId,pos(e));lastInput=performance.now();
  if(ptrs.size===1){downAt=pos(e);moved=false}else if(ptrs.size===2){const[a,b]=[...ptrs.values()];pz={d:Math.hypot(a.x-b.x,a.y-b.y)};moved=true}});
app.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const o=ptrs.get(e.pointerId),p=pos(e);ptrs.set(e.pointerId,p);lastInput=performance.now();if(mode!=='map')return;
  if(ptrs.size===1){if(Math.hypot(p.x-downAt.x,p.y-downAt.y)>8)moved=true;const g=1+zEff*7;tv.lon-=(p.x-o.x)/W*160/g;tv.lat+=(p.y-o.y)/H*120/g}
  else if(ptrs.size===2&&pz){const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);z=Math.max(0,Math.min(1,z+Math.log(d/pz.d)*.7));pz.d=d}});
const up=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(ptrs.size<2)pz=null;if(moved||e.type==='pointercancel')return;
  const p=pos(e),n=performance.now();if(n-lastTap<300&&mode==='map'){lastTap=0;resetView();return}lastTap=n;
  if(!started){start();return}if(!camOn)startCam();const o=orbPos();if(Math.hypot(p.x-o.x,p.y-o.y)<110*o.k)micToggle()};
app.addEventListener('pointerup',up);app.addEventListener('pointercancel',up);
convoEl.addEventListener('pointerdown',e=>{e.stopPropagation();lpT=setTimeout(()=>{lpT='done';askKey()},700)});
convoEl.addEventListener('pointerup',e=>{e.stopPropagation();if(lpT==='done'){lpT=null;return}clearTimeout(lpT);lpT=null;if(!started)start();else micToggle()});

function start(){started=true;say("Salut Yaniss. Ultron en ligne.");micOn=!!SR;setConvo();setTimeout(recStart,2500);startCam()}
startCam();

function resize(){W=innerWidth;H=innerHeight;oc.width=260*DPR;oc.height=260*DPR;ox.setTransform(DPR,0,0,DPR,0,0);place();if(G){G.renderer.setSize(W,H);G.camera.aspect=W/H;G.camera.updateProjectionMatrix()}}
addEventListener('resize',resize);resize();
function loop(t){renderGlobe(t);drawOrb(t);requestAnimationFrame(loop)}requestAnimationFrame(loop);
